openapi: 3.2.0
info:
  title: Fastly Object Storage Buckets API
  description: 'Fastly Object Storage is an S3-compatible cloud storage solution designed

    as a drop-in replacement for traditional object storage services, featuring

    zero egress fees and 99.999999999% (11 9''s) data durability. The API is

    Amazon S3-compatible, allowing existing tooling to be used unmodified.'
  version: 1.0.0
servers:
- url: https://storage.fastly.com
security:
- SigV4: []
tags:
- name: Buckets
paths:
  /:
    get:
      tags:
      - Buckets
      summary: List Buckets
      operationId: listBuckets
      responses:
        '200':
          description: A list of buckets
  /{bucket}:
    parameters:
    - in: path
      name: bucket
      required: true
      schema:
        type: string
    put:
      tags:
      - Buckets
      summary: Create Bucket
      operationId: createBucket
      responses:
        '200':
          description: Bucket created
    delete:
      tags:
      - Buckets
      summary: Delete Bucket
      operationId: deleteBucket
      responses:
        '204':
          description: Bucket deleted
components:
  securitySchemes:
    SigV4:
      type: apiKey
      in: header
      name: Authorization
      description: AWS SigV4 signed request using Fastly Object Storage access keys
