openapi: 3.2.0
info:
  title: Fastly DDoS Protection Events API
  description: 'The Fastly DDoS Protection Events API allows you to configure Fastly DDoS

    Protection and view attack insights including events, rules, and traffic

    statistics. Endpoints are exposed under /ddos-protection/v1/.'
  version: 1.0.0
servers:
- url: https://api.fastly.com
security:
- FastlyKey: []
tags:
- name: Events
paths:
  /ddos-protection/v1/events:
    get:
      tags:
      - Events
      summary: List DDoS Events
      operationId: listDdosEvents
      responses:
        '200':
          description: A list of DDoS events
  /ddos-protection/v1/events/{event_id}:
    parameters:
    - in: path
      name: event_id
      required: true
      schema:
        type: string
    get:
      tags:
      - Events
      summary: Get DDoS Event By Id
      operationId: getDdosEvent
      responses:
        '200':
          description: A DDoS event
components:
  securitySchemes:
    FastlyKey:
      type: apiKey
      in: header
      name: Fastly-Key
