openapi: 3.2.0
info:
  title: Fastly Utilities PO Ps API
  description: 'The Fastly Utilities API covers various utilities and extra functionality

    provided in addition to the configuration services. Endpoints include

    Content Status, Diff, Docs, POPs, Public IP List, and Sudo Mode.

    '
  version: 1.0.0
servers:
- url: https://api.fastly.com
security:
- FastlyKey: []
tags:
- name: POPs
paths:
  /datacenters:
    get:
      tags:
      - POPs
      summary: List Points Of Presence
      operationId: listPops
      responses:
        '200':
          description: Fastly Points of Presence with geographic locations
components:
  securitySchemes:
    FastlyKey:
      type: apiKey
      in: header
      name: Fastly-Key
