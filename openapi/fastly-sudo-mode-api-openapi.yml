openapi: 3.2.0
info:
  title: Fastly Utilities Sudo Mode API
  description: 'The Fastly Utilities API covers various utilities and extra functionality

    provided in addition to the configuration services. Endpoints include

    Content Status, Diff, Docs, POPs, Public IP List, and Sudo Mode.'
  version: 1.0.0
servers:
- url: https://api.fastly.com
security:
- FastlyKey: []
tags:
- name: Sudo Mode
paths:
  /sudo:
    post:
      tags:
      - Sudo Mode
      summary: Enable Sudo Mode
      operationId: enableSudoMode
      responses:
        '200':
          description: Sudo mode enabled
components:
  securitySchemes:
    FastlyKey:
      type: apiKey
      in: header
      name: Fastly-Key
