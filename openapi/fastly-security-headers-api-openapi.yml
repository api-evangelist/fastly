openapi: 3.2.0
info:
  title: Fastly Client-Side Protection Security Headers API
  description: 'Fastly Client-Side Protection (CSP) provides visibility and control over

    third-party scripts running on your web pages. The service monitors script

    behavior, manages authorization status, and configures security policies to

    defend against client-side attacks like Magecart and formjacking.'
  version: 1.0.0
servers:
- url: https://api.fastly.com
security:
- FastlyKey: []
tags:
- name: Security Headers
paths:
  /client-side-protection/websites/{website_id}/security-headers:
    parameters:
    - in: path
      name: website_id
      required: true
      schema:
        type: string
    get:
      tags:
      - Security Headers
      summary: List Security Headers
      operationId: listSecurityHeaders
      responses:
        '200':
          description: Security headers observed
  /client-side-protection/websites/{website_id}/security-headers/events:
    parameters:
    - in: path
      name: website_id
      required: true
      schema:
        type: string
    get:
      tags:
      - Security Headers
      summary: List Header Events
      operationId: listHeaderEvents
      responses:
        '200':
          description: Header events
components:
  securitySchemes:
    FastlyKey:
      type: apiKey
      in: header
      name: Fastly-Key
